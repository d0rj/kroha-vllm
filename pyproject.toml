[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kroha-vllm"
version = "0.1.0"
description = "Native paged-attention and GDN cache adapter for standalone HF Kroha"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["vllm>=0.32,<0.33", "transformers>=5.17", "fla-core==0.5.2"]

[project.urls]
Repository = "https://github.com/d0rj/kroha-vllm"

[project.entry-points."vllm.general_plugins"]
kroha = "kroha_vllm:register"

[tool.setuptools]
py-modules = ["kroha_vllm"]
